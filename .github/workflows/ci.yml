name: CI

# Lint always runs. The dbt job needs two repository secrets (see README, "CI setup"):
#   GCP_PROJECT_ID   - the Google Cloud project ID
#   GCP_KEYFILE_JSON - the full JSON key of a service account with the roles
#                      BigQuery Data Editor and BigQuery Job User
# Without them the dbt job is skipped, not failed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SQL lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sqlfluff lint models tests

  dbt:
    name: dbt build
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_KEYFILE_JSON: ${{ secrets.GCP_KEYFILE_JSON }}
      GCP_KEYFILE_PATH: ${{ github.workspace }}/gcp-keyfile.json
      DBT_PROFILES_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Google Cloud secrets
        id: secrets
        run: |
          if [ -n "$GCP_PROJECT_ID" ] && [ -n "$GCP_KEYFILE_JSON" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GCP secrets are not set, so dbt build was skipped."
          fi

      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.available == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.secrets.outputs.available == 'true'
        run: pip install -r requirements.txt

      - name: Write credentials and profile
        if: steps.secrets.outputs.available == 'true'
        run: |
          printf '%s' "$GCP_KEYFILE_JSON" > "$GCP_KEYFILE_PATH"
          cp profiles.example.yml profiles.yml

      - name: dbt build (models and tests, into the dbt_ci dataset)
        if: steps.secrets.outputs.available == 'true'
        run: dbt build --target ci

      - name: Generate dbt docs
        if: steps.secrets.outputs.available == 'true' && github.ref == 'refs/heads/main'
        run: dbt docs generate --target ci --static

      - name: Upload docs
        if: steps.secrets.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: target/static_index.html

      - name: Remove credentials
        if: always()
        run: rm -f "$GCP_KEYFILE_PATH"
